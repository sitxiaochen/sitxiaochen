name: Profile README Update

on:
  # Daily at 00:17 UTC. GitHub may delay cron runs under load; that is expected.
  schedule:
    - cron: "17 0 * * *"
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh GitHub activity blocks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update README dynamic blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): refresh dynamic GitHub activity blocks"
          git push origin HEAD:${{ github.ref_name }}
